<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Awal — Aplikasi Invoice Fuji Seat</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-card { background:#fff; border-radius:10px; padding:32px; width:100%; max-width:400px; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
  .login-card h1 { font-size:18px; color:var(--navy); margin:0 0 4px; text-align:center; }
  .login-card .sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:24px; }
  .login-card .form-group { margin-bottom:14px; }
  .login-card label { display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:4px; }
  .login-card input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
  .login-card button { width:100%; margin-top:8px; padding:11px; font-size:14px; }
  .login-error { color:#c0392b; font-size:12px; margin-top:10px; text-align:center; min-height:16px; }
  .login-success { color:#0f7a4a; font-size:13px; margin-top:10px; text-align:center; }
</style>
</head>
<body>
  <div class="login-card">
    <h1>Setup Akun Pertama</h1>
    <div class="sub">Akun ini otomatis jadi <strong>Manager</strong>. Hanya bisa dipakai sekali — kalau sudah ada akun, halaman ini akan otomatis ditolak.</div>
    <form id="setupForm">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input id="name" required>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input id="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Password (minimal 6 karakter)</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="6">
      </div>
      <button type="submit" class="btn-primary">Buat Akun Manager</button>
      <div class="login-error" id="err"></div>
      <div class="login-success" id="ok" style="display:none">Akun berhasil dibuat! Mengalihkan ke halaman login...</div>
    </form>
  </div>
  <script>
    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('err');
      errEl.textContent = '';
      try {
        const res = await fetch('/api/setup', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error || 'Gagal setup'; return; }
        document.getElementById('setupForm').style.display = 'none';
        document.getElementById('ok').style.display = 'block';
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } catch (err) {
        errEl.textContent = 'Terjadi kesalahan koneksi';
      }
    });
  </script>
</body>
</html>
