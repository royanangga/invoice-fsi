<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Invoice — PT. Fuji Seat Indonesia</title>
<link rel="icon" id="faviconLink" href="data:,">
<link rel="stylesheet" href="style.css">
<script>
  fetch('/api/public/branding').then(r => r.json()).then(b => {
    if (b && b.logo) {
      document.getElementById('faviconLink').href = b.logo;
      const loaderLogo = document.getElementById('loaderLogo');
      if (loaderLogo) loaderLogo.innerHTML = `<img src="${b.logo}" alt="Logo">`;
    }
  }).catch(() => {});
</script>
</head>
<body>
  <div id="topLoader" class="top-loader"></div>
  <div id="appLoader" class="app-loader">
    <div class="loader-logo" id="loaderLogo">FS</div>
    <div class="loader-ring"></div>
  </div>
  <div id="app"></div>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
