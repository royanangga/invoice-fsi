<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Aplikasi Invoice Fuji Seat</title>
<link rel="icon" id="faviconLink" href="data:,">
<link rel="stylesheet" href="style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-card { background:#fff; border-radius:10px; padding:32px; width:100%; max-width:360px; box-shadow:0 2px 12px rgba(0,0,0,0.08); transition: opacity .25s ease; }
  .login-card h1 { font-size:18px; color:var(--navy); margin:0 0 4px; text-align:center; }
  .login-card .sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:24px; }
  .login-card .form-group { margin-bottom:14px; }
  .login-card label { display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:4px; }
  .login-card input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
  .login-card button { width:100%; margin-top:8px; padding:11px; font-size:14px; }
  .login-error { color:#c0392b; font-size:12px; margin-top:10px; text-align:center; min-height:16px; }
</style>
</head>
<body>
  <div class="login-card" id="loginCard" style="opacity:0">
    <h1>Aplikasi Invoice</h1>
    <div class="sub">PT. Fuji Seat Indonesia</div>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input id="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="btnLogin">Masuk</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
  <script>
    // Kalau sudah login (cookie sesi masih valid), langsung lempar ke halaman utama
    // supaya tidak bisa balik ke form login selama masih dalam sesi aktif.
    (async () => {
      try {
        const res = await fetch('/api/me');
        const me = await res.json();
        if (me) { window.location.replace('index.html'); return; }
      } catch (e) { /* abaikan, anggap belum login */ }
      document.getElementById('loginCard').style.opacity = '1';
    })();

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn || btn.disabled) return;
      btn.classList.remove('btn-pop');
      void btn.offsetWidth;
      btn.classList.add('btn-pop');
      const rect = btn.getBoundingClientRect();
      const hasCoords = e.clientX || e.clientY;
      const x = hasCoords ? e.clientX - rect.left : rect.width / 2;
      const y = hasCoords ? e.clientY - rect.top : rect.height / 2;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });

    fetch('/api/public/branding').then(r => r.json()).then(b => {
      if (b && b.logo) document.getElementById('faviconLink').href = b.logo;
    }).catch(() => {});
    const btnLogin = document.getElementById('btnLogin');
    const btnLoginOriginal = btnLogin.innerHTML;
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.textContent = '';
      btnLogin.disabled = true;
      btnLogin.innerHTML = '<span class="spinner"></span> Memproses...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error || 'Login gagal'; btnLogin.disabled = false; btnLogin.innerHTML = btnLoginOriginal; return; }
        window.location.href = 'index.html';
      } catch (err) {
        errEl.textContent = 'Terjadi kesalahan koneksi';
        btnLogin.disabled = false; btnLogin.innerHTML = btnLoginOriginal;
      }
    });
  </script>
</body>
</html>
